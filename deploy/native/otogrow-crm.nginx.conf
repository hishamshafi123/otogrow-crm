# /etc/nginx/sites-available/otogrow-crm.conf
#
# Cloudflare -> Nginx (Origin CA cert) -> Twenty server on 127.0.0.1:3002.
# The Nest process serves both the REST/GraphQL API and the built SPA
# (dist/front, via @nestjs/serve-static), so there is a single upstream.
#
# This replaces deploy/Caddyfile. Caddy is not used: it wants ports 80 and
# 443, which nginx already owns for bon.otogrow.com and otogrow.com, and
# Let's Encrypt HTTP-01 could not validate anyway because public 443 is
# firewalled to Cloudflare.
#
# Deliberately declares NO default_server -- bon.conf already owns the
# default 80/443 blocks, and a second default_server makes `nginx -t` fail,
# which would take BON and otogrow.com down with it. `map` and
# `limit_req_zone` names live in one shared http namespace across all
# vhosts, so every name here is prefixed `crm_`.

map $http_upgrade $crm_connection_upgrade {
    default upgrade;
    ''      close;
}

# Ported from the Caddyfile's @publicPages matcher. See the "forms/portal
# routing rule" section of deploy/RUNBOOK.md before changing any of this.
map $http_accept $crm_wants_html {
    default       0;
    "~*text/html" 1;
}

limit_req_zone $binary_remote_addr zone=crm_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=crm_auth:10m    rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name crm.otogrow.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04) predates the `http2 on;` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.otogrow.com;

    ssl_certificate     /etc/nginx/certs/otogrow-crm-origin.pem;
    ssl_certificate_key /etc/nginx/certs/otogrow-crm-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CRM_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Twenty accepts file attachments and CSV imports.
    client_max_body_size 100m;
    client_body_timeout 120s;
    server_tokens off;

    # Matches the header block the Caddyfile set.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               image/svg+xml text/plain application/graphql;

    # ---------------------------------------------------------------------
    # /forms/:publicId and /portal/:token are BOTH hosted SPA pages and
    # public REST prefixes. The Nest controllers answer on those paths no
    # matter what the Accept header says, so a browser navigation has to be
    # steered to the SPA's index.html here, while XHR/fetch passes through.
    #
    # The regex allows exactly one path segment, so deeper API routes such as
    # /portal/:token/quotes/:quoteId/pdf never match and always reach the
    # controller. The portal SPA fetches PDFs as XHR blobs for this reason.
    #
    # `rewrite ... last` is one of the two directives that are safe inside
    # `if` (the other is `return`); it re-enters location matching with the
    # new URI and lands in `location /` below, which proxies it upstream.
    # The browser URL is unchanged -- this is an internal rewrite.
    # ---------------------------------------------------------------------
    location ~ ^/(forms|portal)/[^/]+/?$ {
        if ($crm_wants_html) {
            rewrite ^ /index.html last;
        }

        limit_req zone=crm_general burst=60 nodelay;
        include /etc/nginx/snippets/otogrow-crm-proxy.conf;
    }

    # Login, signup and token endpoints get a tighter rate limit.
    location /auth/ {
        limit_req zone=crm_auth burst=20 nodelay;
        include /etc/nginx/snippets/otogrow-crm-proxy.conf;
    }

    # Health endpoint: no rate limit, no access log, never cached.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/otogrow-crm-proxy.conf;
    }

    location / {
        limit_req zone=crm_general burst=90 nodelay;
        include /etc/nginx/snippets/otogrow-crm-proxy.conf;
    }
}
