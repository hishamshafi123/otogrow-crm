# /etc/redis/otogrow-crm.conf
#
# Second Redis instance, for the CRM only. Deliberately shares no file, port,
# socket, data directory or log with the packaged redis-server instance on
# 6379 -- that one belongs to BON and is not touched by this deployment.

# Loopback only. Nginx and the app are on this host; nothing external ever
# needs to reach Redis, and port 6380 is never opened in any firewall.
bind 127.0.0.1 -::1
port 6380
protected-mode yes

# The instance is unreachable off-host and the CRM units are the only local
# processes that can resolve it, so no requirepass. Add one here (and
# REDIS_URL=redis://:<pw>@127.0.0.1:6380 in crm.env) if that ever changes.

supervised systemd
daemonize no
pidfile /run/redis-otogrow-crm/redis-server.pid

logfile /var/log/redis-otogrow-crm/redis-server.log
loglevel notice

dir /var/lib/redis-otogrow-crm
dbfilename dump.rdb

# BullMQ jobs must never be evicted: a dropped key is a lost background job.
# This is the setting that makes a dedicated instance necessary.
maxmemory-policy noeviction
maxmemory 160mb

# Queue state should survive a restart. AOF everysec plus periodic RDB gives
# at-most-one-second loss without the fsync-per-write cost.
appendonly yes
appendfsync everysec
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb

save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Small single-app instance; 16 is the default and more than enough.
databases 16
timeout 0
tcp-keepalive 300
