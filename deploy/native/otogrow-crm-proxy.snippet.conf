# /etc/nginx/snippets/otogrow-crm-proxy.conf
#
# Shared proxy settings for every location in otogrow-crm.conf. Kept in one
# snippet so the four locations cannot drift apart -- in particular so that
# none of them silently loses the X-Forwarded-* headers the Nest server uses
# to build absolute URLs for portal links, file links and emails.

proxy_pass http://127.0.0.1:3002;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $crm_connection_upgrade;

proxy_set_header CF-Connecting-IP $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
# $remote_addr, not $proxy_add_x_forwarded_for: the cloudflare-realip snippet
# trusts only Cloudflare ranges, so $remote_addr is the authenticated visitor
# IP. Any inbound forwarding chain is attacker-controlled and is overwritten
# here rather than appended to.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;

# GraphQL subscriptions hold long-lived websockets, and CSV imports and PDF
# generation can outrun the 60s default.
proxy_connect_timeout 15s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Streamed downloads (attachments, generated PDFs) should not be spooled to
# disk before the client sees a byte.
proxy_buffering off;
proxy_request_buffering off;
